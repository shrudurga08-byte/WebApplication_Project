plugins{
    id 'java'
    id 'application'
}

group =' com.example'
version = '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

dependencies{
    //JUnit 5 for TDD 
    testImplementation platform('org.junit:junit-bom:5.10.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
}

application{
    mainClass = 'com.example.App' // We will create this in a larger phase
}

test{
    useJUnitPlatform()
}